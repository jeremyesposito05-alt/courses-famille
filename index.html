<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Famille</title>
<meta name="description" content="Courses, menus et budget de la famille, partagés entre les téléphones.">
<meta name="theme-color" content="#2F6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Famille">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1D2A23; --muted:#5B6860; --line:#DDE2DA;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --sel:#E4F0E8; --chip:#E9EDE6;
  --papa:#2A6F9B; --papa-bg:#E2EEF6; --maman:#A8416F; --maman-bg:#F6E4EC;
  --courge:#B85B14; --warn:#9A5410; --bad:#A8322D; --good:#2F6B4F;
  --r-fl:#3E8A5B; --r-viande:#B23A3A; --r-frais:#2A6F9B; --r-boul:#B7832A; --r-epi:#8A5A2B; --r-surg:#2E93AE; --r-placard:#7A807C;
  --alert-bg:#FFF4E5; --alert-ink:#7A4308;
  --serif:"Young Serif",Georgia,serif;
  --sans:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#101612; --surface:#19211C; --ink:#E5ECE7; --muted:#9AA89F; --line:#2B3630;
    --accent:#72C396; --accent-ink:#0E1511; --sel:#1D3227; --chip:#222C26;
    --papa:#7DB8DD; --papa-bg:#1B2D3A; --maman:#E28DB3; --maman-bg:#3A1F2C;
    --courge:#E8914A; --warn:#E6A55C; --bad:#EE8A84; --good:#72C396;
    --r-fl:#72C396; --r-viande:#EE8A84; --r-frais:#7DB8DD; --r-boul:#E2B85A; --r-epi:#C99A6B; --r-surg:#6FD0E6; --r-placard:#9AA29D;
    --alert-bg:#3A2A12; --alert-ink:#F5C98A;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* barre du haut */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(var(--top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:0;flex:1;line-height:1.15}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.off i{background:var(--warn)}
.me{border:0;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700}
.me.Papa{background:var(--papa-bg);color:var(--papa)} .me.Maman{background:var(--maman-bg);color:var(--maman)}

main{padding:0 16px calc(var(--bot) + 96px)}

/* onglets de course */
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);margin-top:8px}
.summary b{color:var(--ink)}

.lnk{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;color:inherit;font-size:inherit;font-family:inherit}
.news{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.news.Papa{background:var(--papa-bg)} .news.Maman{background:var(--maman-bg)}
.news button{margin-left:auto;border:0;background:none;font-weight:700;text-decoration:underline;padding:0}

.rayon{margin-top:20px}
.rayon h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rc);margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:8px}
.rayon h2::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--rc)}
.rayon h2 span{margin-left:auto;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:11px 0 11px 10px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--rc)}

/* alertes */
.alerts{margin-top:12px;background:var(--alert-bg);color:var(--alert-ink);border-radius:12px;padding:10px 12px}
.alerts h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.alerts ul{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid rgba(0,0,0,.08);font-size:.9rem;color:var(--ink)}
.alerts li:first-child{border-top:0}
.alerts .ic{flex:none;width:22px;text-align:center}
.alerts li button{margin-left:auto;flex:none;border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 2px}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;line-height:18px;padding:0 5px}
.tabs button{position:relative}
.update{position:fixed;left:16px;right:16px;top:calc(var(--top) + 8px);z-index:40;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:left}

/* courses datées */
.seg{overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{display:flex;flex-direction:column;align-items:center;min-width:92px;line-height:1.2}
.seg .tn{font-size:.82rem}
.seg .td{font-size:.7rem;font-weight:400;opacity:.8}
.seg .seg-more{flex:none;min-width:40px;font-size:1.2rem;justify-content:center}
.trip-edit{border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.trip-edit .actions{margin-top:8px}
.store-btn{background:var(--chip);color:var(--ink)}
.store-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* mode magasin : gros caractères, l'essentiel seulement */
body.store .row{padding:16px 0 16px 12px;grid-template-columns:40px 1fr auto}
body.store .box{width:34px;height:34px;border-radius:9px}
body.store .box[aria-checked="true"]::after{width:9px;height:17px}
body.store .name{font-size:1.25rem}
body.store .prod,body.store .tags,body.store .note:not(.frz){display:none}
body.store .price{font-size:1.05rem}
body.store .rayon h2{font-size:.9rem}
.taken{margin-top:24px;border-top:2px solid var(--line);padding-top:8px}
.taken summary{font-weight:700;color:var(--muted);padding:8px 0;cursor:pointer}

/* quinzaines et historique */
.per-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:16px}
.per-head .btn{flex:none;font-size:.85rem}
.pline{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;text-align:left}
.pline span{color:var(--muted);font-size:.85rem}
.pline[aria-pressed="true"] span{color:var(--accent);font-weight:700}
ul.hist{list-style:none;padding:0;margin:8px 0 0}
ul.hist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
ul.hist small{color:var(--muted)}
.meal.today{background:var(--sel);border-radius:10px}

/* budget : palette des graphiques (ordre fixe, une couleur par catégorie) */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--s-other:#9a9a95}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s-other:#6f6f6a}}
.mnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.mnav b{min-width:150px;text-align:center}
.b-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.b-tab{width:100%;border-collapse:collapse;margin-top:6px;font-size:.92rem}
.b-tab th,.b-tab td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.b-tab th:first-child,.b-tab td:first-child{text-align:left;color:var(--muted)}
.b-tab th.Papa{color:var(--papa)} .b-tab th.Maman{color:var(--maman)}
.b-tab tr.tot td{font-weight:700;border-bottom:0;font-size:1rem}
.b-solde{font-size:1.1rem;margin:6px 0}
.b-solde b.Papa{color:var(--papa)} .b-solde b.Maman{color:var(--maman)}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.donut svg{width:150px;height:150px}
.d-big{font-family:var(--serif);font-size:17px;fill:var(--ink)}
.d-small{font-size:10px;fill:var(--muted)}
.legend{list-style:none;margin:0;padding:0;font-size:.86rem}
.legend li{display:grid;grid-template-columns:12px 1fr auto 38px;gap:6px;align-items:center;padding:3px 0}
.legend i{width:12px;height:12px;border-radius:3px}
.legend b{font-weight:700;color:var(--ink)} .legend small{color:var(--muted);text-align:right}
@media (max-width:380px){.donut{grid-template-columns:1fr;justify-items:center}}
.b-list{margin-top:22px}
.b-list h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between}
.b-row{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0 10px 10px;box-shadow:inset 3px 0 0 var(--rc)}
.b-row b{display:block} .b-row small{display:block;color:var(--muted);font-size:.8rem}
.b-amt{font-weight:700;text-align:right;white-space:nowrap}
.b-amt small{font-weight:400}
.tag.warn{background:var(--alert-bg);color:var(--alert-ink)}
.b-go{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.b-go .btn{font-size:.85rem;padding:12px 6px}
.f-tab{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
.f-tab th,.f-tab td{padding:8px 4px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
.f-tab th:first-child,.f-tab td:first-child{text-align:left}
.f-tab thead th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--bg)}
.f-tab thead th.Papa{color:var(--papa)} .f-tab thead th.Maman{color:var(--maman)}
.f-tab .f-cat th,.f-tab .f-cat td{font-weight:700;padding-top:16px;border-bottom:2px solid var(--rc);color:var(--ink)}
.f-tab .f-cat th{color:var(--rc)}
.f-tab tbody td:first-child{box-shadow:inset 3px 0 0 var(--rc);padding-left:8px}
.f-tab .f-cat th{box-shadow:none;padding-left:0}
.f-name{border:0;background:none;padding:0;text-align:left;width:100%}
.f-name b{display:block;font-weight:700} .f-name small{display:block;color:var(--muted);font-size:.78rem}
.f-tab tfoot th,.f-tab tfoot td{font-weight:700;border-bottom:0;padding-top:12px;font-size:.95rem}
.f-tab tfoot small{font-weight:400;color:var(--muted)}
.payer{border:0;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem;min-width:70px}
.payer.Papa{background:var(--papa-bg);color:var(--papa)} .payer.Maman{background:var(--maman-bg);color:var(--maman)} .payer.none{background:var(--alert-bg);color:var(--alert-ink)}
.scroll-x{overflow-x:auto;margin:0 -4px}
.sim-tab td,.sim-tab th{white-space:nowrap}
.sim-tab td:first-child{white-space:normal;min-width:110px}
input.sim{width:88px;display:inline-block;margin:0;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
#simEffect{line-height:1.8}
/* une couleur par page : on sait toujours où l'on est */
:root{--t-accueil:#2F6B4F;--t-courses:#1565C0;--t-menus:#C2560C;--t-budget:#5E35B1;--t-reglages:#455A64}
@media (prefers-color-scheme:dark){:root{--t-accueil:#72C396;--t-courses:#64A8F0;--t-menus:#FF9A5C;--t-budget:#A58BEA;--t-reglages:#9FB3BE}}
body{--theme:var(--t-accueil)}
body[data-tab="courses"]{--theme:var(--t-courses)} body[data-tab="menus"]{--theme:var(--t-menus)}
body[data-tab="budget"]{--theme:var(--t-budget)} body[data-tab="reglages"]{--theme:var(--t-reglages)}
body[data-tab]{--accent:var(--theme);background:color-mix(in srgb,var(--theme) 6%,var(--bg))}
body[data-tab] .top{background:color-mix(in srgb,var(--theme) 16%,var(--bg));border-bottom:4px solid var(--theme)}
body[data-tab] .top h1{color:var(--theme)}
body[data-tab] .f-tab thead th{background:color-mix(in srgb,var(--theme) 6%,var(--bg))}
.tabs button[aria-selected="true"]{color:var(--theme);box-shadow:inset 0 3px 0 var(--theme)}
.fab{background:var(--theme)}
.seg button[aria-pressed="true"]{color:var(--theme);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 -2px 0 var(--theme)}
.tiles .tile{background:color-mix(in srgb,var(--tc) 9%,var(--surface));border-color:color-mix(in srgb,var(--tc) 35%,var(--line));box-shadow:inset 0 5px 0 var(--tc)}
.tiles .tile .tile-t{color:var(--tc)}
.tiles .tile-ic{background:var(--tc);color:var(--surface)}

/* une couleur par catégorie du budget (assez foncée pour rester lisible en texte) */
:root{--c1:#1565C0;--c2:#00897B;--c3:#E65100;--c4:#2E7D32;--c5:#D81B60;--c6:#B8860B;--c7:#6A1B9A;--c8:#827717;
  --c9:#C62828;--c10:#3949AB;--c11:#6D4C41;--c12:#0277BD;--c13:#AD1457;--c14:#00695C;--c15:#4527A0;--c16:#616161}
@media (prefers-color-scheme:dark){:root{--c1:#64A8F0;--c2:#4DD0C4;--c3:#FF8A50;--c4:#72C27A;--c5:#F0628F;--c6:#E6B84A;--c7:#B97BE0;--c8:#C0CA33;
  --c9:#EF6B6B;--c10:#8C9EFF;--c11:#BC8F7E;--c12:#4FC3F7;--c13:#E57BA6;--c14:#4DB6AC;--c15:#9C8CF0;--c16:#A8A8A8}}

/* projets */
.proj{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;box-shadow:inset 4px 0 0 var(--rc)}
.proj-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proj-head b{font-size:1.05rem}
.proj-amt{text-align:right;white-space:nowrap} .proj-amt b{font-size:1.1rem} .proj-amt small{display:block;color:var(--muted);font-size:.75rem}
.durees{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.dur{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dur span{font-size:.72rem;color:var(--muted)} .dur b{font-size:.82rem}
.dur.on{border-color:var(--rc);background:var(--sel);box-shadow:inset 0 0 0 1px var(--rc)}
.proj-res{margin:10px 0 0;font-size:.92rem}
.proj .actions{margin-top:10px}

/* menus par semaine */
.wnav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:14px;text-align:center}
.wnav b{display:block;font-family:var(--serif);font-weight:400;font-size:1.1rem}
.wnav .note{display:block;margin:2px 0 0}
.meal.empty .m{color:var(--muted);font-weight:400;font-style:normal}

/* accueil */
.hello{margin-top:18px}
.hello .eyebrow{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hello h2{font-family:var(--serif);font-weight:400;font-size:1.8rem;margin:2px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:150px;box-shadow:inset 0 3px 0 var(--tc)}
.tile:active{background:var(--sel)}
.tile-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tc);background:var(--chip);margin-bottom:6px}
.tile-ic svg{width:24px;height:24px}
.tile-t{font-family:var(--serif);font-size:1.15rem}
.tile-s{font-size:.8rem;color:var(--muted)}
.tile-k{font-size:.85rem;font-weight:700;line-height:1.35}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.quick .btn{flex:1 1 30%;font-size:.85rem;padding:12px 8px}
.f-tab tr[data-fact]{cursor:pointer}
.f-tab tr[data-fact]:active td{background:var(--sel)}
.f-sub{display:block;font-weight:400;font-size:.75rem;color:var(--muted);text-transform:none;letter-spacing:0}
.b-sub{font-family:var(--sans);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
.b-sub small{text-transform:none;letter-spacing:0;font-weight:400}
.obj{margin:4px 0 0;padding:6px 10px;border-left:3px solid var(--courge);background:var(--chip);border-radius:0 6px 6px 0;font-size:.85rem;color:var(--muted)}
ul.plan{list-style:none;padding:0;margin:4px 0 0}
ul.plan li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.Papa-t{color:var(--papa)} .Maman-t{color:var(--maman)}

/* modification des menus */
.meal .by{display:inline-block;font-size:.68rem;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px}
.meal .by.Papa{background:var(--papa-bg);color:var(--papa)} .meal .by.Maman{background:var(--maman-bg);color:var(--maman)}
textarea.t{display:block;width:100%;margin-top:4px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:70px;resize:vertical}
.btn.wide{width:100%;margin-top:10px}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px;background:none;padding:0}
.box[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.box[aria-checked="true"]::after{content:"";width:7px;height:13px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-2px)}
.body{min-width:0;border:0;background:none;text-align:left;padding:0}
.name{font-weight:700;display:block}
.qty{color:var(--courge)}
.prod{display:block;font-size:.84rem;opacity:.85}
.note{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.note.frz{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:.68rem;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.02em}
.tag.Papa{background:var(--papa-bg);color:var(--papa)} .tag.Maman{background:var(--maman-bg);color:var(--maman)}
.tag.new{background:var(--courge);color:#fff}
.tag.act{background:var(--chip);color:var(--bad)}
.price{text-align:right;font-weight:700;white-space:nowrap}
.price small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.row.done .name,.row.done .prod{text-decoration:line-through;opacity:.45}
.row.done .note,.row.done .price,.row.done .tags{opacity:.4}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

.fab{position:fixed;right:16px;bottom:calc(var(--bot) + 76px);width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:15}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(var(--bot) + 6px)}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:.75rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}

/* menus */
.week{font-family:var(--serif);font-weight:400;font-size:1.15rem;margin:22px 0 4px}
.meal{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.date{text-align:center}
.dow{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dnum{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1}
.meal .c{display:block;font-size:.78rem;color:var(--muted)}
.meal .m{display:block;font-weight:700}
.meal .k{display:block;font-size:.8rem;color:var(--muted)}
.meal .k b{color:var(--courge)}

/* réglages et accueil */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.card h2{font-family:var(--serif);font-weight:400;font-size:1.15rem;margin:0 0 8px}
.card p{margin:6px 0;color:var(--muted);font-size:.92rem}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-top:12px}
input.t,select.t{display:block;width:100%;margin-top:4px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.who button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-weight:700;font-size:1rem}
.who button.Papa[aria-pressed="true"]{border-color:var(--papa);background:var(--papa-bg);color:var(--papa)}
.who button.Maman[aria-pressed="true"]{border-color:var(--maman);background:var(--maman-bg);color:var(--maman)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%;margin-top:18px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.err{color:var(--bad);font-size:.88rem;margin-top:8px}
ol.steps{padding-left:20px;margin:6px 0;color:var(--ink);font-size:.92rem}

/* feuille (ajout / modification / recette) */
dialog{border:0;padding:0;margin:0;margin-top:auto;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);position:fixed;bottom:0;left:0;right:0;margin-left:auto;margin-right:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px 16px calc(var(--bot) + 18px);overflow:auto;max-height:92vh}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:1.25rem;margin:0}
.x{border:1px solid var(--line);background:none;border-radius:50%;width:34px;height:34px;flex:none;font-size:1.1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.95rem}
.chk input{width:22px;height:22px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .primary{margin-top:0;flex:1}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:1rem;margin:16px 0 4px}
.sheet ul,.sheet ol{padding-left:20px;margin:0}
.sheet li{margin:3px 0}
.lana{margin-top:14px;padding:10px 12px;border-left:3px solid var(--maman);background:var(--chip);border-radius:0 8px 8px 0;font-size:.92rem}

.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 140px);z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{margin-left:auto;border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo" hidden>Annuler</button></div>

<script src="recettes.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
